name: Publish artwork
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: artwork-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download frozen artwork
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/$GH_REPO/releases/download/artwork-2026-10-28-mobile"
          curl --fail --location --retry 3 "$base/artwork-site-mobile-20261028.zip.part1" -o part1
          curl --fail --location --retry 3 "$base/artwork-site-mobile-20261028.zip.part2" -o part2
          cat part1 part2 > artwork.zip
          echo "cf5c2507ccccb32855e39ebbef45b061f5a9ec68f584fd7ac8173d442e14c035  artwork.zip" | sha256sum --check
          mkdir site
          unzip -q artwork.zip -d site
          test -f site/index.html
          test -f site/full-partitions-20261028-current.mp4
      - name: Apply verified sharing kit
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/${{ github.repository }}/releases/download/artwork-2026-10-28-share/artwork-share-overlay-20261028.zip" -o overlay.zip
          echo "8368153f1be5e6ab1582df7d6e79a991b9cb9a4b8ae8764e3b1b27edf05ff9c1  overlay.zip" | sha256sum --check
          unzip -q -o overlay.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy artwork
        id: deployment
        uses: actions/deploy-pages@v4
